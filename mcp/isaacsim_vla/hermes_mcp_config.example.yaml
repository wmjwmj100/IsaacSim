      ISAACSIM_VLA_SAMPLE_WRIST: /work/IsaacSim/outputs/so100_smolvla_base_gui_smoke3/frame_0000000_infer_000001_wrist.png
    tools:
      include:
        - look_camera
        - draw_boxes
        - vla_execute
